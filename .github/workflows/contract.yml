name: contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the declared floor (tomllib); 3.13 is current.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: selftest (every mutation trips its check)
        run: python3 scripts/assert-agent-workflow.py --selftest

      - name: gotcha index <-> docs/gotchas parity
        run: python3 scripts/assert-agent-workflow.py

      - name: llms.txt matches a fresh generation
        run: python3 scripts/gen-llms-txt.py --check

      - name: symlinks resolve in the working tree (not dereferenced to files)
        run: |
          # Assert the working tree, not `git ls-files -s`: the latter reads the
          # index, so a `core.symlinks=false` checkout that dereferences the
          # links into regular files would pass it. Only `test -L` catches that.
          bad=0
          for p in .claude/skills CLAUDE.md; do
            if [ ! -L "$p" ]; then
              echo "::error::$p is not a symlink in the working tree"
              bad=1
            fi
          done
          exit "$bad"

      - name: install.sh is idempotent into a fresh repo
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          bash scripts/install.sh "$tmp"
          (cd "$tmp" && python3 scripts/gen-llms-txt.py && python3 scripts/assert-agent-workflow.py)
          test -f "$tmp/gotcha.toml"
          snap="$(cd "$tmp" && find . -path ./.git -prune -o -type f -exec cksum {} + | sort)"
          bash scripts/install.sh "$tmp"
          test "$snap" = "$(cd "$tmp" && find . -path ./.git -prune -o -type f -exec cksum {} + | sort)"
          (cd "$tmp" && python3 scripts/gen-llms-txt.py --check && python3 scripts/assert-agent-workflow.py)

      - name: install.sh --copy produces identical copies the contract accepts
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          bash scripts/install.sh "$tmp" --tools claude,cursor,opencode --copy
          (cd "$tmp" && python3 scripts/assert-agent-workflow.py)
