name: contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the declared floor (tomllib) and a newer supported interpreter.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: validate shipped skill with a YAML loader
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 scripts/test-skill-frontmatter.py

      - name: selftest (every mutation trips its check)
        run: python3 scripts/assert-agent-workflow.py --selftest

      - name: gotcha index <-> docs/gotchas parity
        run: python3 scripts/assert-agent-workflow.py

      - name: configured fleet measurements and cost signals
        run: python3 scripts/test-measure-adoption.py

      - name: llms.txt matches a fresh generation
        run: python3 scripts/gen-llms-txt.py --check

      - name: validate the Claude web upload package
        run: |
          python3 scripts/test-skill-package.py
          python3 scripts/build-skill-zip.py
          python3 scripts/build-skill-zip.py --check dist/gotcha-distill.zip

      - name: no symlinks are tracked
        run: |
          # Preserve the repository's copy-only distribution convention.
          # Claude web uploads use the separate package validated above.
          if git ls-files -s | awk '$1 == "120000"' | grep -q .; then
            echo "::error::tracked symlinks found; replace them with real files"
            git ls-files -s | awk '$1 == "120000" {print "  " $4}'
            exit 1
          fi

      - name: install.sh is idempotent into a fresh repo
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          bash scripts/install.sh "$tmp"
          (cd "$tmp" && python3 scripts/gen-llms-txt.py && python3 scripts/assert-agent-workflow.py)
          test -f "$tmp/gotcha.toml"
          snap="$(cd "$tmp" && find . -path ./.git -prune -o -type f -exec cksum {} + | sort)"
          bash scripts/install.sh "$tmp"
          test "$snap" = "$(cd "$tmp" && find . -path ./.git -prune -o -type f -exec cksum {} + | sort)"
          (cd "$tmp" && python3 scripts/gen-llms-txt.py --check && python3 scripts/assert-agent-workflow.py)

      - name: install.sh wires multiple tools and the contract accepts them
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          bash scripts/install.sh "$tmp" --tools claude,cursor,opencode
          (cd "$tmp" && python3 scripts/assert-agent-workflow.py)

      - name: save the validated upload ZIP for release preparation
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: claude-skill-package
          path: dist/gotcha-distill.zip
          if-no-files-found: error
