# Layout of this repository, for scripts/assert-agent-workflow.py and
# scripts/gen-llms-txt.py.
#
# Every key is optional and every default is the layout shown here, so a
# repository without this file behaves exactly as one with it. Adopt the file
# only when your paths differ.

[project]
# Used as the llms.txt H1. Explicit, because the directory a repository happens
# to be cloned into is not its name — CI checks out as the repo name while a
# local clone may not, and a generated file that differs between them fails
# its own drift check.
name = "gotcha-distill"

[paths]
contract    = "AGENTS.md"
gotchas     = "docs/gotchas"
postmortems = "docs/postmortems"

[index]
# The H2 that opens the always-loaded trigger index inside `contract`.
heading = "## Environment gotchas"
# Assert every entry states what it cost (a mechanical half of "incident-born":
# an entry that cannot name a cost is an opinion). Opt-in, so legacy repos can
# backfill without inventing costs they never recorded.
require_cost = true

[skill]
name = "gotcha-distill"
# Always visible in every session, so this is a ratchet rather than a vendor
# limit. Claude Code budget-scales per-skill listing descriptions and truncates
# long ones in a busy multi-skill session (its hard ceiling for description +
# when_to_use is 1,536), so 250 keeps the whole description — trigger words
# included — intact.
description_max_chars = 250
